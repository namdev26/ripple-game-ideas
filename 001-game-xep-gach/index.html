<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Xếp Gạch</title>
<style>
:root{--bg:#eef3e6;--panel:#fff;--ink:#1f2a1f;--muted:#6b7a6b;--accent:#e8a400;--line:#d3dbca;--green:#2f8f4e;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#c{position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;touch-action:none}
#top{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;pointer-events:none}
#top>*{pointer-events:auto}
.title{font-weight:800;font-size:18px;margin-right:4px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;box-shadow:0 1px 3px #0001}
button,select{font:inherit;font-size:14px;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--ink)}
button:hover{border-color:#a9b69e}
button.on{background:#fff4d6;border-color:var(--accent)}
button.primary{background:var(--green);color:#fff;border-color:var(--green)}
#instr{position:fixed;top:58px;right:14px;width:290px;pointer-events:none}
#instr .hd{background:var(--panel);border:2px solid var(--line);border-bottom:none;border-radius:14px 14px 0 0;padding:8px 12px;font-weight:800;display:flex;justify-content:space-between;transition:background .3s}
#instr .hd.flash{background:#ffe08a}
#instrView{height:220px;border-left:2px solid var(--line);border-right:2px solid var(--line)}
#callout{background:var(--panel);border:2px solid var(--line);border-top:1px dashed var(--line);border-radius:0 0 14px 14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;min-height:20px}
.co{display:flex;align-items:center;gap:2px;font-weight:800;font-size:13px;background:#e9f5d8;border-radius:8px;padding:2px 8px 2px 2px}
.co img{width:40px;height:40px}
#tray{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:flex-end;padding:12px 14px;overflow-x:auto;background:linear-gradient(#eef3e600,#eef3e6ee 35%)}
.tools{display:flex;flex-direction:column;gap:6px;flex:none}
.part{position:relative;width:80px;flex:none;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 2px 3px;text-align:center;cursor:pointer;transition:transform .1s}
.part:hover{transform:translateY(-2px)}
.part.sel{border-color:var(--accent);box-shadow:0 0 0 3px #e8a40055;transform:translateY(-4px)}
.part.empty{opacity:.3;pointer-events:none}
.part img{width:64px;height:64px;display:block;margin:auto}
.part .cnt{position:absolute;top:3px;right:7px;font-weight:800;font-size:13px}
.part .key{position:absolute;top:3px;left:7px;font-size:11px;color:var(--muted)}
.part .nm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#help{position:fixed;left:14px;bottom:118px;font-size:12px;color:var(--muted);line-height:1.6;pointer-events:none}
#help b{color:var(--ink)}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#1f2a1f;color:#fff;padding:8px 14px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center}
#toast.show{opacity:.92}
#win{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center}
#win.show{display:flex}
#win .box{background:var(--panel);border-radius:18px;padding:24px 28px;text-align:center;min-width:280px;box-shadow:0 10px 40px #0004}
#win h2{margin:0 0 6px}
#stars{font-size:40px;color:var(--accent);letter-spacing:4px}
#win .row{display:flex;gap:8px;justify-content:center;margin-top:14px}
@media (max-width:700px){
  #instr{width:170px;top:96px;right:8px}
  #instrView{height:130px}
  .co img{width:26px;height:26px}
  #help{display:none}
  .title{display:none}
}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <span class="title">Xếp Gạch</span>
  <select id="levelSel" aria-label="Chọn màn"></select>
  <span class="pill" id="stepPill">Bước 1/1</span>
  <span class="pill" id="errPill">Lỗi: 0</span>
  <button id="hintBtn" title="Hiện bóng mờ các mảnh của bước này (H) — mất 1 sao">Gợi ý</button>
  <button id="resetBtn">Chơi lại</button>
</div>

<div id="instr">
  <div class="hd" id="instrHd"><span id="instrTitle">Bước 1</span><span id="instrSub" style="color:var(--muted);font-weight:600"></span></div>
  <div id="instrView"></div>
  <div id="callout"></div>
</div>

<div id="help">
  <b>Chọn mảnh</b> ở khay (phím 1–9) · <b>Click</b> để lắp<br>
  <b>R</b> / chuột phải: xoay mảnh · <b>Esc</b>: bỏ chọn<br>
  Kéo chuột: xoay góc nhìn · Lăn chuột: zoom
</div>

<div id="tray">
  <div class="tools">
    <button id="rotBtn" title="Xoay mảnh (R)">⟳ Xoay</button>
    <button id="deselBtn" title="Bỏ chọn (Esc)">✕ Bỏ</button>
  </div>
  <div id="parts" style="display:flex;gap:8px"></div>
</div>

<div id="toast"></div>

<div id="win"><div class="box">
  <h2>Hoàn thành!</h2>
  <div id="stars">★★★</div>
  <div id="winInfo" style="color:var(--muted)"></div>
  <div class="row"><button id="againBtn">Chơi lại</button><button class="primary" id="nextBtn">Màn tiếp →</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ====================== DỮ LIỆU ======================
const PLATE = 0.4;          // chiều cao 1 tấm (plate) so với 1 ô stud
const M = 2;                // lề lưới quanh mô hình
const COLORS = {
  green:{hex:0x2a8a48, name:'Xanh lá'},
  lime: {hex:0x9fcb2c, name:'Xanh nõn'},
  white:{hex:0xf2f2ec, name:'Trắng'},
  red:  {hex:0xd42a1f, name:'Đỏ'},
  black:{hex:0x2b3036, name:'Đen'},
};
// w: số stud theo trục X, d: theo trục Z (khi xoay 0), h: chiều cao tính bằng plate (brick = 3)
const PARTS = {
  plate_2x4:{w:4,d:2,h:1,shape:'box',  name:'Tấm 2×4'},
  plate_2x6:{w:6,d:2,h:1,shape:'box',  name:'Tấm 2×6'},
  plate_2x8:{w:8,d:2,h:1,shape:'box',  name:'Tấm 2×8'},
  plate_4x4:{w:4,d:4,h:1,shape:'box',  name:'Tấm 4×4'},
  brick_1x1:{w:1,d:1,h:3,shape:'box',  name:'Gạch 1×1'},
  brick_1x2:{w:2,d:1,h:3,shape:'box',  name:'Gạch 1×2'},
  brick_2x2:{w:2,d:2,h:3,shape:'box',  name:'Gạch 2×2'},
  slope_2x2:{w:2,d:2,h:3,shape:'slope',name:'Dốc 2×2'},
  round_1x1:{w:1,d:1,h:1,shape:'round',name:'Tròn 1×1'},
};
// Mỗi mảnh: [part, màu, x, y(plate), z, xoay 0..3]. Dốc: xoay 1 = thấp về -X, xoay 3 = thấp về +X
const LEVELS = [
  { name:'1. Cây nấm', size:[4,4], steps:[
    [['brick_2x2','white',1,0,1,0]],
    [['brick_2x2','white',1,3,1,0]],
    [['plate_4x4','red',0,6,0,0]],
    [['slope_2x2','red',0,7,0,1],['slope_2x2','red',0,7,2,1],['slope_2x2','red',2,7,0,3],['slope_2x2','red',2,7,2,3]],
    [['round_1x1','white',1,10,0,0],['round_1x1','white',2,10,1,0],['round_1x1','white',1,10,3,0]],
  ]},
  { name:'2. Dưa hấu', size:[8,2], steps:[
    [['plate_2x6','green',1,0,0,0]],
    [['plate_2x8','green',0,1,0,0]],
    [['plate_2x4','white',0,2,0,0],['plate_2x4','white',4,2,0,0]],
    [['slope_2x2','red',0,3,0,1],['slope_2x2','red',6,3,0,3]],
    [['brick_1x1','red',2,3,0,0],['brick_1x1','black',3,3,0,0],['brick_1x2','red',4,3,0,0]],
    [['brick_1x2','red',2,3,1,0],['brick_1x1','black',4,3,1,0],['brick_1x1','red',5,3,1,0]],
    [['slope_2x2','red',1,6,0,1],['slope_2x2','red',5,6,0,3]],
    [['brick_1x1','red',3,6,0,0],['brick_1x1','black',4,6,0,0],['brick_1x1','black',3,6,1,0],['brick_1x1','red',4,6,1,0]],
    [['slope_2x2','red',2,9,0,1],['slope_2x2','red',4,9,0,3]],
  ]},
];

// ====================== HÌNH HỌC ======================
const footprint = (key,rot) => { const p=PARTS[key]; return rot%2 ? [p.d,p.w] : [p.w,p.d]; };
const facing = rot => { const t=rot*Math.PI/2; return [Math.round(-Math.sin(t)), Math.round(-Math.cos(t))]; };
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

const STUD_GEO = new THREE.CylinderGeometry(0.3,0.3,0.17,16).translate(0,0.085,0);
const STUD_EDGES = new THREE.EdgesGeometry(STUD_GEO,25);
const geoCache = {};
function partGeos(key){
  if (geoCache[key]) return geoCache[key];
  const p=PARTS[key], H=p.h*PLATE, studs=[];
  let body;
  if (p.shape==='slope'){
    const hd=p.d/2-0.02, s=new THREE.Shape();
    // mặt cắt: thấp ở +sx, sau khi xoay Y 90° → thấp ở -Z
    s.moveTo(hd,0); s.lineTo(-hd,0); s.lineTo(-hd,H); s.lineTo(-hd+1,H); s.lineTo(hd,0.12);
    body=new THREE.ExtrudeGeometry(s,{depth:p.w-0.04,bevelEnabled:false});
    body.rotateY(Math.PI/2); body.translate(-(p.w-0.04)/2,0,0);
    for(let i=0;i<p.w;i++) studs.push([i-p.w/2+0.5, H, p.d/2-0.5]);
  } else if (p.shape==='round'){
    body=new THREE.CylinderGeometry(0.46,0.46,H,24).translate(0,H/2,0);
    studs.push([0,H,0]);
  } else {
    body=new THREE.BoxGeometry(p.w-0.04,H,p.d-0.04).translate(0,H/2,0);
    for(let i=0;i<p.w;i++) for(let j=0;j<p.d;j++) studs.push([i-p.w/2+0.5,H,j-p.d/2+0.5]);
  }
  const arr=[...new THREE.EdgesGeometry(body,25).attributes.position.array];
  const se=STUD_EDGES.attributes.position.array;
  for(const [x,y,z] of studs) for(let i=0;i<se.length;i+=3) arr.push(se[i]+x,se[i+1]+y,se[i+2]+z);
  const edges=new THREE.BufferGeometry(); edges.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  return geoCache[key]={body,studs,edges};
}

const matCache={}, hlMats=[];
function getMat(color,mode){
  const k=color+'|'+mode; if (matCache[k]) return matCache[k];
  const m=new THREE.MeshLambertMaterial({color:COLORS[color].hex,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
  if (mode==='ghost'){ m.transparent=true; m.opacity=0.3; m.depthWrite=false; }
  if (mode==='hl') hlMats.push(m);
  return matCache[k]=m;
}
const LINE = {
  solid:new THREE.LineBasicMaterial({color:0x1d241d}),
  dark: new THREE.LineBasicMaterial({color:0x78838c}),
  ghost:new THREE.LineBasicMaterial({color:0x1d241d,transparent:true,opacity:0.35}),
  hl:   new THREE.LineBasicMaterial({color:0xff8a00}),
};
function makeBrick(key,color,mode='solid'){
  const g=partGeos(key), grp=new THREE.Group(), inner=new THREE.Group(); grp.add(inner);
  let mat;
  if (mode==='preview'){ mat=getMat(color,'solid').clone(); mat.transparent=true; mat.opacity=0.72; }
  else mat=getMat(color,mode);
  const body=new THREE.Mesh(g.body,mat); inner.add(body);
  const meshes=[body];
  for(const s of g.studs){ const m=new THREE.Mesh(STUD_GEO,mat); m.position.set(...s); inner.add(m); meshes.push(m); }
  const lm = mode==='ghost'?LINE.ghost : mode==='hl'?LINE.hl : color==='black'?LINE.dark : LINE.solid;
  const lines=new THREE.LineSegments(g.edges,lm); inner.add(lines);
  grp.userData={inner,body,meshes,lines,mat};
  return grp;
}
function setBrickMode(obj,color,mode){
  const mat=getMat(color,mode);
  obj.userData.meshes.forEach(m=>m.material=mat);
  obj.userData.lines.material = mode==='hl'?LINE.hl : color==='black'?LINE.dark : LINE.solid;
}
function placeObj(obj,key,x,y,z,rot){
  const [fx,fz]=footprint(key,rot);
  obj.position.set(x+fx/2, y*PLATE, z+fz/2);
  obj.userData.inner.rotation.y=rot*Math.PI/2;
}

// ====================== RENDERER / SCENE ======================
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.autoClear=false;
const scene=new THREE.Scene(), iscene=new THREE.Scene();
function addLights(s){
  s.add(new THREE.HemisphereLight(0xffffff,0x7d8c74,0.8));
  const d=new THREE.DirectionalLight(0xffffff,0.55); d.position.set(-5,12,8); s.add(d);
}
addLights(scene); addLights(iscene);
const camera=new THREE.PerspectiveCamera(38,1,0.1,300);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enablePan=false; controls.enableDamping=true; controls.dampingFactor=0.12;
controls.minDistance=4; controls.maxDistance=45; controls.maxPolarAngle=Math.PI*0.495;
controls.addEventListener('start',()=>{controls.autoRotate=false;});
const icam=new THREE.PerspectiveCamera(30,1,0.1,300);

// thumbnail renderer
const thumbR=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
thumbR.setSize(128,128); thumbR.setPixelRatio(1);
const tscene=new THREE.Scene(); addLights(tscene);
const tcam=new THREE.PerspectiveCamera(30,1,0.1,100);
const thumbCache={};
function thumb(key,color){
  const k=key+'|'+color; if (thumbCache[k]) return thumbCache[k];
  const p=PARTS[key], H=p.h*PLATE, o=makeBrick(key,color);
  if (p.shape==='slope') o.userData.inner.rotation.y=Math.PI; // cho mặt dốc quay về phía camera
  tscene.add(o);
  const r=Math.sqrt(p.w*p.w+p.d*p.d+H*H)/2+0.2, dist=r/Math.sin(15*Math.PI/180);
  const dir=new THREE.Vector3(-0.8,0.9,1.2).normalize();
  tcam.position.copy(dir.multiplyScalar(dist)).add(new THREE.Vector3(0,H/2,0)); tcam.lookAt(0,H/2,0);
  thumbR.render(tscene,tcam);
  tscene.remove(o);
  return thumbCache[k]=thumbR.domElement.toDataURL();
}

// ====================== ÂM THANH ======================
let actx=null;
function tone(f,dur,type='triangle',vol=0.12,delay=0){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+delay;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
const sfx={
  snap(){ tone(1500,0.04,'square',0.05); tone(520,0.09,'triangle',0.14,0.015); },
  wrong(){ tone(150,0.2,'sawtooth',0.08); tone(120,0.2,'sawtooth',0.06,0.08); },
  step(){ tone(660,0.12); tone(880,0.16,'triangle',0.12,0.1); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.25,'triangle',0.13,i*0.11)); },
  pick(){ tone(900,0.04,'sine',0.06); },
};

// ====================== TRẠNG THÁI ======================
let L, levelIdx=0, step=0, targets=[], heights=new Map(), tray=[], sel=-1, rot=0;
let mistakes=0, hintUsed=false, hintOn=false, done=false;
let levelRoot=null, ilevelRoot=null, floorPlane=null, pickables=[], preview=null, ghosts=[];
let iCenter=new THREE.Vector3(), iDist=10, anims=[];
const $=id=>document.getElementById(id);

function toast(msg,ms=1600){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),ms);
}

function loadLevel(i){
  levelIdx=i; L=LEVELS[i]; $('levelSel').value=i;
  if (levelRoot) scene.remove(levelRoot);
  if (ilevelRoot) iscene.remove(ilevelRoot);
  levelRoot=new THREE.Group(); scene.add(levelRoot);
  ilevelRoot=new THREE.Group(); iscene.add(ilevelRoot);
  heights=new Map(); mistakes=0; hintUsed=false; hintOn=false; done=false; anims=[]; ghosts=[];
  $('hintBtn').classList.remove('on'); $('win').classList.remove('show');
  controls.autoRotate=false;

  targets=[];
  L.steps.forEach((s,si)=>s.forEach(([key,color,x,y,z,r])=>targets.push({key,color,x,y,z,rot:r,step:si,placed:false})));
  validateLevel();

  // nền lưới
  const [sx,sz]=L.size, W=sx+2*M, D=sz+2*M;
  floorPlane=new THREE.Mesh(new THREE.PlaneGeometry(W,D).rotateX(-Math.PI/2), new THREE.MeshLambertMaterial({color:0xd8e2cd}));
  floorPlane.position.set(sx/2,0,sz/2); levelRoot.add(floorPlane);
  const pts=[];
  for(let x=-M;x<=sx+M;x++) pts.push(x,0.003,-M, x,0.003,sz+M);
  for(let z=-M;z<=sz+M;z++) pts.push(-M,0.003,z, sx+M,0.003,z);
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  levelRoot.add(new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0xb5c3a8})));
  pickables=[floorPlane];

  // mô hình hướng dẫn
  let maxH=0;
  targets.forEach(t=>{
    t.iobj=makeBrick(t.key,t.color); placeObj(t.iobj,t.key,t.x,t.y,t.z,t.rot); ilevelRoot.add(t.iobj);
    maxH=Math.max(maxH,(t.y+PARTS[t.key].h)*PLATE);
  });
  iCenter.set(sx/2,maxH/2,sz/2);
  iDist=Math.sqrt(sx*sx+sz*sz+maxH*maxH)/2/Math.sin(15*Math.PI/180)*1.05;

  // camera chính
  controls.target.copy(iCenter);
  const dir=new THREE.Vector3(0.45,0.75,1).normalize();
  camera.position.copy(iCenter).add(dir.multiplyScalar(Math.max(sx,sz,maxH)*1.5+7));

  // khay mảnh
  const map=new Map(); tray=[];
  targets.forEach(t=>{ const k=t.key+'|'+t.color; if(!map.has(k)){ const it={key:t.key,color:t.color,left:0}; map.set(k,it); tray.push(it);} map.get(k).left++; });
  const box=$('parts'); box.innerHTML='';
  tray.forEach((it,idx)=>{
    const el=document.createElement('div'); el.className='part';
    el.innerHTML=`<span class="key">${idx<9?idx+1:''}</span><span class="cnt"></span><img alt=""><div class="nm"></div>`;
    el.querySelector('img').src=thumb(it.key,it.color);
    el.querySelector('.nm').textContent=PARTS[it.key].name+' '+COLORS[it.color].name.toLowerCase();
    el.title=el.querySelector('.nm').textContent;
    el.onclick=()=>select(sel===idx?-1:idx);
    it.el=el; box.appendChild(el);
  });
  updateTray(); select(-1);
  setStep(0);
}

function validateLevel(){
  const hm=new Map();
  targets.forEach(t=>{
    const [fx,fz]=footprint(t.key,t.rot); let m=0;
    for(let i=0;i<fx;i++) for(let j=0;j<fz;j++) m=Math.max(m,hm.get((t.x+i)+','+(t.z+j))||0);
    if (m!==t.y) console.warn(`[${L.name}] bước ${t.step+1}: ${t.key} ở (${t.x},${t.z}) có y=${t.y} nhưng sẽ rơi xuống y=${m}`);
    for(let i=0;i<fx;i++) for(let j=0;j<fz;j++) hm.set((t.x+i)+','+(t.z+j),t.y+PARTS[t.key].h);
  });
}

function setStep(s){
  step=s;
  targets.forEach(t=>{ t.iobj.visible=t.step<=s; setBrickMode(t.iobj,t.color,t.step===s?'hl':'solid'); });
  $('instrTitle').textContent=`Bước ${s+1}`;
  $('instrSub').textContent=`/ ${L.steps.length}`;
  $('stepPill').textContent=`Bước ${s+1}/${L.steps.length}`;
  // callout: các mảnh cần cho bước này
  const need=new Map();
  targets.filter(t=>t.step===s).forEach(t=>{const k=t.key+'|'+t.color; need.set(k,(need.get(k)||0)+1);});
  $('callout').innerHTML='';
  need.forEach((n,k)=>{ const [key,color]=k.split('|'); const d=document.createElement('div'); d.className='co';
    d.innerHTML=`<img src="${thumb(key,color)}" alt="">${n}×`; $('callout').appendChild(d); });
  const hd=$('instrHd'); hd.classList.add('flash'); setTimeout(()=>hd.classList.remove('flash'),400);
  refreshGhosts();
}

function refreshGhosts(){
  ghosts.forEach(g=>levelRoot.remove(g)); ghosts=[];
  if (!hintOn||done) return;
  targets.filter(t=>t.step===step&&!t.placed).forEach(t=>{
    const g=makeBrick(t.key,t.color,'ghost'); placeObj(g,t.key,t.x,t.y,t.z,t.rot); levelRoot.add(g); ghosts.push(g); t.ghost=g;
  });
}

function updateTray(){
  tray.forEach(it=>{ it.el.querySelector('.cnt').textContent=it.left+'×'; it.el.classList.toggle('empty',it.left===0); });
  $('errPill').textContent=`Lỗi: ${mistakes}`;
}

function select(i){
  if (i>=0 && tray[i].left===0) return;
  sel=i; rot=0;
  tray.forEach((it,idx)=>it.el.classList.toggle('sel',idx===sel));
  if (preview){ levelRoot.remove(preview); preview=null; }
  if (sel>=0){ preview=makeBrick(tray[sel].key,tray[sel].color,'preview'); preview.visible=false; levelRoot.add(preview); sfx.pick(); refreshPreview(); }
}
function rotateSel(){ if(sel<0) return; rot=(rot+1)%4; refreshPreview(); }

// ====================== CHỌN VỊ TRÍ ======================
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let lastHit=null, cand=null;
function updatePointer(e){
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables,false);
  if (!hits.length){ lastHit=null; refreshPreview(); return; }
  const h=hits[0], n=h.face.normal.clone().transformDirection(h.object.matrixWorld);
  lastHit = n.y>0.5 ? {px:h.point.x, pz:h.point.z} : {px:h.point.x+n.x*0.5, pz:h.point.z+n.z*0.5};
  refreshPreview();
}
function landY(x,z,fx,fz){
  let m=0; for(let i=0;i<fx;i++) for(let j=0;j<fz;j++) m=Math.max(m,heights.get((x+i)+','+(z+j))||0); return m;
}
function refreshPreview(){
  if (!preview) { cand=null; return; }
  if (!lastHit||done){ preview.visible=false; cand=null; return; }
  const it=tray[sel], [fx,fz]=footprint(it.key,rot);
  const x=clamp(Math.round(lastHit.px-fx/2),-M,L.size[0]+M-fx);
  const z=clamp(Math.round(lastHit.pz-fz/2),-M,L.size[1]+M-fz);
  const y=landY(x,z,fx,fz);
  cand={key:it.key,color:it.color,x,y,z,rot};
  placeObj(preview,it.key,x,y,z,rot); preview.visible=true;
}

function matches(t,c){
  if (t.placed||t.key!==c.key||t.color!==c.color||t.x!==c.x||t.z!==c.z) return false;
  const a=footprint(t.key,t.rot), b=footprint(c.key,c.rot);
  if (a[0]!==b[0]||a[1]!==b[1]) return false;
  if (PARTS[c.key].shape==='slope'){ const f1=facing(t.rot), f2=facing(c.rot); if(f1[0]!==f2[0]||f1[1]!==f2[1]) return false; }
  return true;
}

function tryPlace(){
  if (done||!cand||!preview) return;
  const c=cand;
  const hit=targets.find(t=>t.step===step&&matches(t,c)&&t.y===c.y);
  if (hit) return commit(hit);
  if (targets.some(t=>t.step===step&&matches(t,c)&&t.y>c.y)) return toast('Mảnh này nằm cao hơn — lắp các mảnh bên dưới trước nhé');
  if (targets.some(t=>t.step>step&&matches(t,c)&&t.y===c.y)) return toast('Đúng chỗ, nhưng mảnh này thuộc bước sau');
  // sai
  mistakes++; updateTray(); sfx.wrong();
  const pv=preview, m=pv.userData.mat, base=getMat(c.color,'solid').color.getHex(), px=pv.position.x;
  m.color.setHex(0xff3333);
  anims.push({t0:performance.now(),dur:320,fn:k=>{ pv.position.x=px+Math.sin(k*Math.PI*6)*0.12*(1-k); if(k>=1){m.color.setHex(base);} }});
  toast('Chưa đúng — xem lại hình hướng dẫn');
}

function commit(t){
  t.placed=true;
  const o=makeBrick(t.key,t.color); placeObj(o,t.key,t.x,t.y,t.z,t.rot); levelRoot.add(o);
  pickables.push(o.userData.body);
  const [fx,fz]=footprint(t.key,t.rot);
  for(let i=0;i<fx;i++) for(let j=0;j<fz;j++) heights.set((t.x+i)+','+(t.z+j),t.y+PARTS[t.key].h);
  if (t.ghost){ levelRoot.remove(t.ghost); t.ghost=null; }
  const y1=t.y*PLATE, y0=y1+0.9;
  anims.push({t0:performance.now(),dur:200,fn:k=>{ const e=1-Math.pow(1-k,3); o.position.y=y0+(y1-y0)*e; }});
  sfx.snap();
  const it=tray.find(i=>i.key===t.key&&i.color===t.color); it.left--; updateTray();
  if (it.left===0) select(-1); else refreshPreview();

  if (targets.filter(x=>x.step===step).every(x=>x.placed)){
    if (step===L.steps.length-1) return win();
    sfx.step(); toast(`Bước ${step+1} xong!`,900);
    setStep(step+1);
  }
}

function win(){
  done=true; select(-1); refreshGhosts(); sfx.win();
  targets.forEach(t=>setBrickMode(t.iobj,t.color,'solid'));
  $('instrTitle').textContent='Xong!'; $('instrSub').textContent=''; $('callout').innerHTML='';
  let stars=3; if(mistakes>0) stars--; if(mistakes>3) stars--; if(hintUsed) stars--; stars=Math.max(1,stars);
  $('stars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('winInfo').textContent=`${L.name} · ${mistakes} lỗi${hintUsed?' · có dùng gợi ý':''}`;
  $('nextBtn').style.display = levelIdx<LEVELS.length-1 ? '' : 'none';
  controls.autoRotate=true; controls.autoRotateSpeed=2.5;
  setTimeout(()=>$('win').classList.add('show'),900);
}

// ====================== INPUT ======================
let downPos=null;
canvas.addEventListener('pointerdown',e=>{ downPos=[e.clientX,e.clientY,e.button]; updatePointer(e); });
canvas.addEventListener('pointermove',e=>updatePointer(e));
canvas.addEventListener('pointerup',e=>{
  if (downPos && downPos[2]===0 && Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1])<6){ updatePointer(e); tryPlace(); }
  downPos=null;
});
canvas.addEventListener('pointerleave',()=>{ lastHit=null; refreshPreview(); });
canvas.addEventListener('contextmenu',e=>{ e.preventDefault(); rotateSel(); });
addEventListener('keydown',e=>{
  if (e.target.tagName==='SELECT') return;
  if (e.key==='r'||e.key==='R') rotateSel();
  else if (e.key==='Escape') select(-1);
  else if (e.key==='h'||e.key==='H') toggleHint();
  else if (/^[1-9]$/.test(e.key)){ const i=+e.key-1; if(tray[i]) select(sel===i?-1:i); }
});
function toggleHint(){
  if (done) return;
  hintOn=!hintOn; if (hintOn && !hintUsed){ hintUsed=true; toast('Đã bật gợi ý (mất 1 sao)'); }
  $('hintBtn').classList.toggle('on',hintOn); refreshGhosts();
}
$('hintBtn').onclick=toggleHint;
$('resetBtn').onclick=()=>loadLevel(levelIdx);
$('rotBtn').onclick=rotateSel;
$('deselBtn').onclick=()=>select(-1);
$('againBtn').onclick=()=>loadLevel(levelIdx);
$('nextBtn').onclick=()=>loadLevel(levelIdx+1);
LEVELS.forEach((l,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=l.name; $('levelSel').appendChild(o); });
$('levelSel').onchange=e=>loadLevel(+e.target.value);

// ====================== LOOP ======================
function resize(){ renderer.setSize(innerWidth,innerHeight,false); camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const instrView=$('instrView'), tmp=new THREE.Vector3();
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now();
  controls.update();
  anims=anims.filter(a=>{ const k=clamp((now-a.t0)/a.dur,0,1); a.fn(k); return k<1; });
  const pulse=(Math.sin(now/220)+1)/2;
  hlMats.forEach(m=>m.emissive.setRGB(0.35*pulse,0.22*pulse,0));
  const w=innerWidth,h=innerHeight;
  renderer.setScissorTest(false); renderer.setViewport(0,0,w,h);
  renderer.setClearColor(0xeef3e6,1); renderer.clear(); renderer.render(scene,camera);
  const r=instrView.getBoundingClientRect();
  if (r.width>0 && r.height>0){
    const y=h-r.bottom;
    renderer.setViewport(r.left,y,r.width,r.height); renderer.setScissor(r.left,y,r.width,r.height); renderer.setScissorTest(true);
    renderer.setClearColor(0xfbfdf7,1); renderer.clear();
    tmp.copy(camera.position).sub(controls.target).normalize();
    icam.position.copy(iCenter).addScaledVector(tmp,iDist); icam.lookAt(iCenter);
    icam.aspect=r.width/r.height; icam.updateProjectionMatrix();
    renderer.render(iscene,icam);
  }
}
loadLevel(0);
requestAnimationFrame(frame);
</script>
</body>
