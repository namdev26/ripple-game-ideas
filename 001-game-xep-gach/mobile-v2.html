<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Xếp Gạch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#141c28;font-family:'Baloo 2',system-ui,sans-serif;color:#2b4a7a;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.78vw);overflow:hidden;container-type:size;
  background:radial-gradient(ellipse 62% 30% at 50% 57%,#ffffffd9 0,#ffffff00 70%),linear-gradient(#72c9f5 0%,#bde7fb 52%,#98d4f2 100%)}
@media (min-aspect-ratio:10/16){ #app{border-radius:30px;box-shadow:0 20px 60px #000a;height:min(96dvh,177.78vw);width:min(100vw,54dvh)} }
#app.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-1.5cqw)}40%{transform:translateX(1.5cqw)}60%{transform:translateX(-1cqw)}80%{transform:translateX(.6cqw)}}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- nút kiểu game ---------- */
.btn{border:none;cursor:pointer;font:800 5cqw/1 'Baloo 2',system-ui;color:#fff;border-radius:4.2cqw;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:0 0 .8cqw;transition:transform .08s,filter .2s}
.btn:active{transform:translateY(.8cqw) scale(.97)}
.btn.blue{background:linear-gradient(#66c8ff,#2f8cf0);box-shadow:inset 0 -1.3cqw 0 #1c5fc2,inset 0 .7cqw 0 #a8e3ff,0 1cqw 2cqw #0003}
.btn.green{background:linear-gradient(#86e85f,#33b44a);box-shadow:inset 0 -1.4cqw 0 #22813a,inset 0 .7cqw 0 #c4f8a6,0 1cqw 2cqw #0003}
.btn.red{background:linear-gradient(#ff907f,#e8473b);box-shadow:inset 0 -1.3cqw 0 #a92a22,inset 0 .7cqw 0 #ffc6bc,0 1cqw 2cqw #0003}
.btn.orange{background:linear-gradient(#ffc04d,#ff8a1a);box-shadow:inset 0 -1.3cqw 0 #c85f00,inset 0 .7cqw 0 #ffe1a1,0 1cqw 2cqw #0003}
.badge{position:absolute;top:-2.2cqw;right:-2.2cqw;min-width:7.4cqw;height:7.4cqw;border-radius:4cqw;background:linear-gradient(#ff9a3d,#ff6a00);border:.7cqw solid #fff;
  color:#fff;font-size:4.2cqw;display:flex;align-items:center;justify-content:center;padding:0 1.3cqw;box-shadow:0 .5cqw 1cqw #0003;line-height:1}
.outline{color:#fff;text-shadow:0 .5cqw 0 #173a7a,.32cqw 0 0 #173a7a,-.32cqw 0 0 #173a7a,0 -.32cqw 0 #173a7a,.32cqw .32cqw 0 #173a7a,-.32cqw .32cqw 0 #173a7a,.32cqw -.32cqw 0 #173a7a,-.32cqw -.32cqw 0 #173a7a}
.outline.o{text-shadow:0 .5cqw 0 #a84800,.32cqw 0 0 #a84800,-.32cqw 0 0 #a84800,0 -.32cqw 0 #a84800,.32cqw .32cqw 0 #a84800,-.32cqw .32cqw 0 #a84800,.32cqw -.32cqw 0 #a84800,-.32cqw -.32cqw 0 #a84800}
.outline.g{text-shadow:0 .5cqw 0 #1d7030,.32cqw 0 0 #1d7030,-.32cqw 0 0 #1d7030,0 -.32cqw 0 #1d7030,.32cqw .32cqw 0 #1d7030,-.32cqw .32cqw 0 #1d7030,.32cqw -.32cqw 0 #1d7030,-.32cqw -.32cqw 0 #1d7030}

/* ---------- HUD ---------- */
#hud{position:absolute;top:4cqw;left:4cqw;right:4cqw;display:flex;align-items:flex-start;justify-content:space-between}
#pauseBtn{width:12.5cqw;height:12.5cqw;flex-direction:row;gap:1.5cqw}
.pz{width:1.9cqw;height:5.6cqw;background:#fff;border-radius:1cqw;box-shadow:0 .45cqw 0 #1c5fc2}
#lvWrap{display:flex;flex-direction:column;align-items:center;gap:1.2cqw;margin-top:.4cqw}
#lvBadge{background:linear-gradient(#5aa6ff,#2c66dc);padding:.4cqw 8cqw 1.2cqw;border-radius:3cqw;font-size:6.4cqw;line-height:1.15;
  box-shadow:inset 0 -1.1cqw 0 #1d4bb0,inset 0 .6cqw 0 #a4ccff,0 .8cqw 1.6cqw #0003;white-space:nowrap}
#pbar{width:38cqw;height:5cqw;background:#1d3566;border-radius:3cqw;border:.6cqw solid #fff;position:relative;overflow:hidden;box-shadow:0 .6cqw 1.2cqw #0002}
#pfill{height:100%;width:0;background:linear-gradient(#97f26f,#3cbf4c);transition:width .35s;border-radius:3cqw}
#ptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3.3cqw;font-weight:800;line-height:1}
#starPill{height:12.5cqw;background:#ffffffb8;border:.6cqw solid #fff;border-radius:4.2cqw;padding:0 2.2cqw;display:flex;align-items:center;gap:.3cqw;box-shadow:0 1cqw 2cqw #0002}
#starPill span{font-size:6.4cqw;line-height:1;color:#ffc21a;text-shadow:0 .45cqw 0 #c98a00;transition:all .3s}
#starPill span.off{color:#c9d6e2;text-shadow:0 .45cqw 0 #a7b8c8;transform:scale(.8)}

/* ---------- mục tiêu: khung hướng dẫn ---------- */
#goal{position:absolute;top:26cqw;left:50%;transform:translateX(-50%);width:54cqw}
#tag{position:absolute;top:-3.6cqw;left:50%;transform:translateX(-50%);z-index:2;background:linear-gradient(#ffc04d,#ff8a1a);padding:.2cqw 4.5cqw .9cqw;
  border-radius:3cqw;font-size:4.4cqw;white-space:nowrap;box-shadow:inset 0 -.9cqw 0 #c85f00,inset 0 .5cqw 0 #ffe1a1,0 .6cqw 1.2cqw #0003;transition:transform .2s}
#tag.pop{animation:tagpop .45s}
@keyframes tagpop{40%{transform:translateX(-50%) scale(1.25)}}
#iview{height:38cqw;border:1.7cqw solid #fff;border-radius:5.5cqw;box-shadow:0 1.2cqw 0 #b9d3e6,0 2.4cqw 4cqw #0002;cursor:zoom-in}
#chips{position:absolute;left:-14cqw;right:-14cqw;bottom:-4.6cqw;display:flex;justify-content:center;gap:1.6cqw;pointer-events:none}
.chip{background:#fff;border-radius:4cqw;display:flex;align-items:center;padding:0 2.2cqw 0 .4cqw;font-size:4cqw;font-weight:800;color:#2b4a7a;
  box-shadow:0 .7cqw 0 #c9dbe9,0 1cqw 1.6cqw #0002;height:8.6cqw;transition:background .2s}
.chip img{width:8cqw;height:8cqw}
.chip.ok{background:#dcf8d0;color:#2a8a3a}
#dots{position:absolute;top:74cqw;left:0;right:0;display:flex;justify-content:center;gap:var(--dg,2cqw)}
.dt{width:var(--ds,4.8cqw);height:var(--ds,4.8cqw);border-radius:50%;background:#d6e5f0;box-shadow:inset 0 .7cqw 0 #b3c9da;border:.6cqw solid #fff;transition:all .3s}
.dt.done{background:#46c25a;box-shadow:inset 0 -.7cqw 0 #2a8a3a}
.dt.cur{background:#ffd43b;box-shadow:inset 0 -.7cqw 0 #d69e00;transform:scale(1.2)}

/* ---------- 2 cột điều khiển camera ---------- */
.pill{position:absolute;top:calc(50% + 4cqw);transform:translateY(-50%);background:#ffffffa8;border:.6cqw solid #fff;border-radius:7cqw;padding:1.5cqw;
  display:flex;flex-direction:column;align-items:center;gap:1.6cqw;box-shadow:0 1cqw 2cqw #0002}
#zoomPill{left:3.4cqw}
.pill button{width:9.6cqw;height:9.6cqw;border-radius:50%;border:none;background:linear-gradient(#66c8ff,#2f8cf0);color:#fff;font:800 6cqw/1 'Baloo 2',system-ui;
  box-shadow:inset 0 -.9cqw 0 #1c5fc2,inset 0 .5cqw 0 #a8e3ff;cursor:pointer;padding:0 0 .6cqw}
.pill button:active{transform:translateY(.5cqw)}
#ztrack{width:3.2cqw;height:24cqw;border-radius:2cqw;background:#cfe0ee;position:relative;cursor:pointer;box-shadow:inset 0 .5cqw .7cqw #0002;touch-action:none}
#zthumb{position:absolute;left:50%;top:50%;width:8cqw;height:8cqw;border-radius:50%;background:linear-gradient(#ffdd66,#f5a700);border:.6cqw solid #fff;
  box-shadow:inset 0 -.7cqw 0 #c98400,0 .6cqw 1cqw #0003;transform:translate(-50%,-50%);pointer-events:none}

/* ---------- khay mảnh ---------- */
#slots{position:absolute;left:3cqw;right:3cqw;bottom:28cqw;height:22.5cqw;background:#ffffff99;border:.7cqw solid #fff;border-radius:5.5cqw;box-shadow:0 1.2cqw 2.6cqw #0002}
#parts{display:flex;gap:2.4cqw;height:100%;align-items:center;padding:0 2.8cqw;overflow-x:auto;touch-action:pan-x;scrollbar-width:none}
#parts::-webkit-scrollbar{display:none}
.part{flex:none;width:16.8cqw;height:16.8cqw;border-radius:3.8cqw;background:linear-gradient(#e2edf6,#cddeeb);box-shadow:inset 0 .9cqw 1.3cqw #0002,0 .5cqw 0 #fff;
  position:relative;display:flex;align-items:center;justify-content:center;cursor:grab;transition:transform .15s,background .2s}
.part img{width:15.5cqw;height:15.5cqw;pointer-events:none;filter:drop-shadow(0 .7cqw .5cqw #0003)}
.part .badge{top:-1.8cqw;right:-1.8cqw;min-width:6.4cqw;height:6.4cqw;font-size:3.6cqw}
.part.sel{background:linear-gradient(#fff8d2,#ffe27a);box-shadow:0 0 0 .9cqw #ffc400,0 1.4cqw 2cqw #0003;transform:translateY(-2cqw) scale(1.05)}
.part.empty{pointer-events:none}
.part.empty img{opacity:.22;filter:grayscale(1)}
.part.empty .badge{display:none}
.part.empty::after{content:"✓";position:absolute;font-size:9cqw;font-weight:800;color:#3cbf4c;text-shadow:0 .5cqw 0 #1d7030}
.part.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(.82)}}

/* ---------- thanh booster / hành động ---------- */
#bar{position:absolute;left:0;right:0;bottom:4.5cqw;height:21cqw}
#boosters,#acts{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:4.5cqw;transition:opacity .2s,transform .2s}
#acts{opacity:0;transform:translateY(6cqw);pointer-events:none}
#bar.holding #boosters{opacity:0;transform:translateY(6cqw);pointer-events:none}
#bar.holding #acts{opacity:1;transform:none;pointer-events:auto}
.boost{width:21cqw;height:21cqw}
.boost .ic{font-size:9.6cqw;line-height:1;filter:drop-shadow(0 .6cqw 0 #0003)}
.boost .lb{font-size:3.4cqw;margin-top:.4cqw}
.boost.off{filter:grayscale(.85) brightness(1.05);opacity:.7}
#aCancel{width:16cqw;height:16cqw;font-size:7.5cqw}

#toast{position:absolute;top:81cqw;left:50%;transform:translate(-50%,2cqw);background:#173a7ae6;color:#fff;padding:1.6cqw 4.6cqw;border-radius:4cqw;
  font-size:4.2cqw;font-weight:700;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;border:.5cqw solid #ffffff66}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- màn phủ ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.show{display:flex}
.modal{background:#0a1a3aa6}
.panel{position:relative;background:linear-gradient(#ffffff,#e8f3fb);border:1cqw solid #fff;border-radius:7cqw;width:80cqw;padding:13cqw 6cqw 7cqw;text-align:center;
  box-shadow:inset 0 -1.8cqw 0 #c3d8e8,0 3cqw 6cqw #0006;animation:rise .35s}
@keyframes rise{from{transform:translateY(10cqw) scale(.9);opacity:0}}
.ribbon{position:absolute;top:-6.5cqw;left:50%;transform:translateX(-50%);background:linear-gradient(#ffc04d,#ff8a1a);padding:1.2cqw 9cqw 2.2cqw;border-radius:4.5cqw;
  font-size:8.4cqw;line-height:1.1;white-space:nowrap;box-shadow:inset 0 -1.3cqw 0 #c85f00,inset 0 .7cqw 0 #ffe1a1,0 1.2cqw 2cqw #0003}
.btn.big{width:62cqw;height:16cqw;font-size:7.6cqw;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:4cqw}
#rStars{display:flex;justify-content:center;gap:1.5cqw;margin-top:-2cqw}
#rStars span{font-size:18cqw;line-height:1;color:#d4dfe8;text-shadow:0 1cqw 0 #b3c4d3}
#rStars span:nth-child(2){transform:translateY(-3.5cqw);font-size:21cqw}
#rStars span.on{color:#ffc21a;text-shadow:0 1cqw 0 #c98a00;animation:starpop .45s}
@keyframes starpop{0%{scale:0;rotate:-45deg}70%{scale:1.3}}
#rImg{width:44cqw;height:44cqw;display:block;margin:0 auto;filter:drop-shadow(0 1.5cqw 1.5cqw #0002)}
#rInfo{color:#6f86a0;font-size:4.4cqw;font-weight:700;margin:-1cqw 0 5cqw}
.row{display:flex;gap:4cqw;justify-content:center;margin-top:4cqw}
.sq{width:14cqw;height:14cqw;font-size:7cqw}
#zoomModal{background:#0a1a3acc;cursor:zoom-out}
#iviewBig{width:90cqw;height:90cqw;border:2cqw solid #fff;border-radius:7cqw;box-shadow:0 3cqw 6cqw #0006}
#zoomModal .t{margin-top:5cqw;font-size:4.6cqw;font-weight:700;color:#cfe3f5}

/* ---------- home ---------- */
#home{background:radial-gradient(circle at 50% 50%,#fff 0,#eaf8ff 22%,#ffffff00 46%),linear-gradient(#72c9f5,#bde7fb 55%,#98d4f2);justify-content:flex-start;padding-top:13cqw}
.logo .r{display:flex;justify-content:center;margin:2.6cqw 0}
.logo b{position:relative;display:inline-flex;width:15cqw;height:15cqw;background:var(--c);color:#fff;border-radius:2.6cqw;font-size:10cqw;line-height:1;
  align-items:center;justify-content:center;margin:0 .8cqw;box-shadow:inset 0 -1.7cqw 0 #0003,inset 0 .8cqw 0 #ffffff40,0 1.2cqw 2cqw #0003;padding-top:1cqw}
.logo b::before{content:"";position:absolute;top:-2.3cqw;left:50%;transform:translateX(-50%);width:6.5cqw;height:2.7cqw;background:var(--c);border-radius:1cqw 1cqw 0 0;box-shadow:inset 0 -.8cqw 0 #0002}
#hPrev{margin-top:3cqw;width:54cqw;height:54cqw;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2cqw)}}
#hPrev img{width:100%;height:100%;filter:drop-shadow(0 3cqw 2cqw #0002)}
#hName{font-size:8cqw;line-height:1;margin-top:-1cqw}
#playBtn{margin-top:5cqw;width:66cqw;height:21cqw}
#playBtn .t{font-size:10.5cqw;line-height:.95}
#playBtn small{font-size:4.2cqw;font-weight:700;opacity:.95}
#hLevels{display:flex;gap:4.5cqw;margin-top:6cqw}
.lvc{width:15cqw;height:15cqw;font-size:7cqw}
.lvc.cur{outline:1cqw solid #ffd43b;outline-offset:.6cqw}
.lvc .st{position:absolute;bottom:-5.6cqw;left:50%;transform:translateX(-50%);font-size:3.8cqw;letter-spacing:-.2cqw;color:#ffc21a;text-shadow:0 .3cqw 0 #c98a00;white-space:nowrap}
.lvc .st .off{color:#ffffffb0;text-shadow:none}
</style>
</head>
<body>
<div id="stage"><div id="app">
  <canvas id="c"></canvas>

  <div id="hud">
    <button class="btn blue" id="pauseBtn" aria-label="Tạm dừng"><span class="pz"></span><span class="pz"></span></button>
    <div id="lvWrap">
      <div id="lvBadge" class="outline">MÀN 1</div>
      <div id="pbar"><div id="pfill"></div><span id="ptext" class="outline">0%</span></div>
    </div>
    <div id="starPill"><span>★</span><span>★</span><span>★</span></div>
  </div>

  <div id="goal">
    <div id="tag" class="outline o">BƯỚC 1/5</div>
    <div id="iview"></div>
    <div id="chips"></div>
  </div>
  <div id="dots"></div>

  <div class="pill" id="zoomPill">
    <button id="zIn" aria-label="Phóng to">+</button>
    <div id="ztrack"><div id="zthumb"></div></div>
    <button id="zOut" aria-label="Thu nhỏ">−</button>
    <button id="zCenter" aria-label="Căn giữa" style="font-size:5cqw">◎</button>
  </div>

  <div id="slots"><div id="parts"></div></div>

  <div id="bar">
    <div id="boosters">
      <button class="btn blue boost" id="bHint"><span class="ic">💡</span><span class="lb outline">Gợi ý</span><span class="badge" id="bHintN">3</span></button>
      <button class="btn blue boost" id="bWand"><span class="ic">🪄</span><span class="lb outline">Tự lắp</span><span class="badge" id="bWandN">2</span></button>
      <button class="btn blue boost" id="bLook"><span class="ic">🔍</span><span class="lb outline">Soi</span></button>
    </div>
    <div id="acts">
      <button class="btn red" id="aCancel" aria-label="Huỷ">✕</button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="zoomModal" class="screen"><div id="iviewBig"></div><div class="t">Chạm để đóng</div></div>

  <div id="pauseModal" class="screen modal"><div class="panel">
    <div class="ribbon outline o">TẠM DỪNG</div>
    <div class="stack">
      <button class="btn green big" id="pResume"><span class="outline g">TIẾP TỤC</span></button>
      <button class="btn blue big" id="pRestart"><span class="outline">CHƠI LẠI</span></button>
      <button class="btn blue big" id="pMenu"><span class="outline">VỀ MENU</span></button>
    </div>
  </div></div>

  <div id="result" class="screen modal"><div class="panel">
    <div class="ribbon outline o" id="rTitle">HOÀN THÀNH!</div>
    <div id="rStars"><span>★</span><span>★</span><span>★</span></div>
    <img id="rImg" alt="">
    <div id="rInfo"></div>
    <button class="btn green big" id="rNext"><span class="outline g">TIẾP TỤC</span></button>
    <div class="row">
      <button class="btn blue sq" id="rMenu" aria-label="Menu">⌂</button>
      <button class="btn blue sq" id="rAgain" aria-label="Chơi lại">↻</button>
    </div>
  </div></div>

  <div id="home" class="screen show">
    <div class="logo">
      <div class="r"><b style="--c:#e2342a">X</b><b style="--c:#f5b700">Ế</b><b style="--c:#2fa04f">P</b></div>
      <div class="r"><b style="--c:#2f7fd6">G</b><b style="--c:#ef7d1a">Ạ</b><b style="--c:#9b59d0">C</b><b style="--c:#e2342a">H</b></div>
    </div>
    <div id="hPrev"><img id="hImg" alt=""></div>
    <div id="hName" class="outline">Cây nấm</div>
    <button class="btn green" id="playBtn"><span class="t outline g">CHƠI</span><small id="playSub">Màn 1</small></button>
    <div id="hLevels"></div>
  </div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ====================== DỮ LIỆU ======================
const PLATE=0.4, M=1;
const COLORS={
  green:{hex:0x2a8a48,name:'xanh lá'}, lime:{hex:0x9fcb2c,name:'xanh nõn'}, white:{hex:0xf4f4ef,name:'trắng'},
  red:{hex:0xd42a1f,name:'đỏ'}, black:{hex:0x2b3036,name:'đen'}, brown:{hex:0x8a5a33,name:'nâu'}, yellow:{hex:0xf5c518,name:'vàng'},
  gray:{hex:0xa9afb6,name:'xám'}, blue:{hex:0x2f6fd6,name:'xanh dương'},
};
const PARTS={
  plate_2x4:{w:4,d:2,h:1,shape:'box',name:'Tấm 2×4'},
  plate_2x6:{w:6,d:2,h:1,shape:'box',name:'Tấm 2×6'},
  plate_2x8:{w:8,d:2,h:1,shape:'box',name:'Tấm 2×8'},
  plate_4x4:{w:4,d:4,h:1,shape:'box',name:'Tấm 4×4'},
  brick_1x1:{w:1,d:1,h:3,shape:'box',name:'Gạch 1×1'},
  brick_1x2:{w:2,d:1,h:3,shape:'box',name:'Gạch 1×2'},
  brick_2x2:{w:2,d:2,h:3,shape:'box',name:'Gạch 2×2'},
  slope_2x2:{w:2,d:2,h:3,shape:'slope',name:'Dốc 2×2'},

const STUD_GEO=new THREE.CylinderGeometry(0.3,0.3,0.17,16).translate(0,0.085,0);
const STUD_EDGES=new THREE.EdgesGeometry(STUD_GEO,25);
const geoCache={};
function partGeos(key){
  if (geoCache[key]) return geoCache[key];
  const p=PARTS[key], H=p.h*PLATE, studs=[]; let body;
  if (p.shape==='slope'){
    const hd=p.d/2-0.02, s=new THREE.Shape();
    s.moveTo(hd,0); s.lineTo(-hd,0); s.lineTo(-hd,H); s.lineTo(-hd+1,H); s.lineTo(hd,0.12);
    body=new THREE.ExtrudeGeometry(s,{depth:p.w-0.04,bevelEnabled:false});
    body.rotateY(Math.PI/2); body.translate(-(p.w-0.04)/2,0,0);
    for(let i=0;i<p.w;i++) studs.push([i-p.w/2+0.5,H,p.d/2-0.5]);
  } else if (p.shape==='cone'){
    body=new THREE.ConeGeometry((p.w-0.04)/Math.SQRT2,H,4).rotateY(Math.PI/4).translate(0,H/2,0).toNonIndexed();
    body.computeVertexNormals();
  } else if (p.shape==='round'){
    body=new THREE.CylinderGeometry(0.46,0.46,H,24).translate(0,H/2,0); studs.push([0,H,0]);
  } else {
    body=new THREE.BoxGeometry(p.w-0.04,H,p.d-0.04).translate(0,H/2,0);
    for(let i=0;i<p.w;i++) for(let j=0;j<p.d;j++) studs.push([i-p.w/2+0.5,H,j-p.d/2+0.5]);
  }
  const arr=[...new THREE.EdgesGeometry(body,25).attributes.position.array], se=STUD_EDGES.attributes.position.array;
  for(const [x,y,z] of studs) for(let i=0;i<se.length;i+=3) arr.push(se[i]+x,se[i+1]+y,se[i+2]+z);
  const edges=new THREE.BufferGeometry(); edges.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
  return geoCache[key]={body,studs,edges};
}
const matCache={}, hlMats=[];
function getMat(color,mode){
  const k=color+'|'+mode; if (matCache[k]) return matCache[k];
  const m=new THREE.MeshLambertMaterial({color:COLORS[color].hex,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1});
  if (mode==='ghost'){ m.transparent=true; m.opacity=0.32; m.depthWrite=false; }
  if (mode==='hl') hlMats.push(m);
  return matCache[k]=m;
}
const LINE={ solid:new THREE.LineBasicMaterial({color:0x1d241d}), dark:new THREE.LineBasicMaterial({color:0x78838c}),
  ghost:new THREE.LineBasicMaterial({color:0x1d241d,transparent:true,opacity:0.35}), hl:new THREE.LineBasicMaterial({color:0xff8a00}) };
function makeBrick(key,color,mode='solid'){
  const g=partGeos(key), grp=new THREE.Group(), inner=new THREE.Group(); grp.add(inner);
  let mat;
  if (mode==='preview'){ mat=getMat(color,'solid').clone(); mat.transparent=true; mat.opacity=0.78; }
  else mat=getMat(color,mode);
  const body=new THREE.Mesh(g.body,mat); inner.add(body);
  const meshes=[body];
  for(const s of g.studs){ const m=new THREE.Mesh(STUD_GEO,mat); m.position.set(...s); inner.add(m); meshes.push(m); }
  const lm=mode==='ghost'?LINE.ghost:mode==='hl'?LINE.hl:color==='black'?LINE.dark:LINE.solid;
  const lines=new THREE.LineSegments(g.edges,lm); inner.add(lines);
  grp.userData={inner,body,meshes,lines,mat};
  return grp;
}
function setBrickMode(obj,color,mode){
  const mat=getMat(color,mode); obj.userData.meshes.forEach(m=>m.material=mat);
  obj.userData.lines.material=mode==='hl'?LINE.hl:color==='black'?LINE.dark:LINE.solid;
}
function placeObj(obj,key,x,y,z,rot){
  const [fx,fz]=footprint(key,rot);
  obj.position.set(x+fx/2,y*PLATE,z+fz/2); obj.userData.inner.rotation.y=rot*Math.PI/2;
}
function modelInfo(lv){
  const ts=levelTargets(lv); let maxH=0; ts.forEach(t=>maxH=Math.max(maxH,(t.y+PARTS[t.key].h)*PLATE));
  const [sx,sz]=lv.size;
  return {ts,center:new THREE.Vector3(sx/2,maxH/2,sz/2),radius:Math.sqrt(sx*sx+sz*sz+maxH*maxH)/2};
}
function fitDist(cam,radius,aspect){
  const v=cam.fov*Math.PI/180, h=2*Math.atan(Math.tan(v/2)*aspect);
  return radius/Math.sin(Math.min(v,h)/2);
}

function tone(f,dur,type='triangle',vol=0.12,delay=0){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+delay;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}

function validateLevel(){
  const hm=new Map();
  targets.forEach(t=>{
    const [fx,fz]=footprint(t.key,t.rot); let m=0;
    for(let i=0;i<fx;i++) for(let j=0;j<fz;j++) m=Math.max(m,hm.get((t.x+i)+','+(t.z+j))||0);
    if (m!==t.y) console.warn(`[${L.name}] bước ${t.step+1}: ${t.key} (${t.x},${t.z}) y=${t.y} nhưng sẽ rơi xuống y=${m}`);
    for(let i=0;i<fx;i++) for(let j=0;j<fz;j++) hm.set((t.x+i)+','+(t.z+j),t.y+PARTS[t.key].h);
  });
}

function setStep(s){
  step=s;
  targets.forEach(t=>{ t.iobj.visible=t.step<=s; setBrickMode(t.iobj,t.color,t.step===s?'hl':'solid'); });
  $('tag').textContent=`BƯỚC ${s+1}/${L.steps.length}`;
  const tg=$('tag'); tg.classList.remove('pop'); void tg.offsetWidth; tg.classList.add('pop');
  [...$('dots').children].forEach((d,i)=>{ d.className='dt'+(i<s?' done':i===s?' cur':''); });
  updateChips(); refreshGhosts();
}
function updateChips(){
  const need=new Map();
  targets.filter(t=>t.step===step).forEach(t=>{ const k=t.key+'|'+t.color; const v=need.get(k)||{n:0,left:0}; v.n++; if(!t.placed) v.left++; need.set(k,v); });
  $('chips').innerHTML='';
  need.forEach((v,k)=>{ const [key,color]=k.split('|'); const d=document.createElement('div'); d.className='chip'+(v.left===0?' ok':'');
    d.innerHTML=`<img src="${thumb(key,color)}" alt="">${v.left===0?'✓':'×'+v.left}`; $('chips').appendChild(d); });
}
function refreshGhosts(){
  ghosts.forEach(g=>levelRoot.remove(g)); ghosts=[];
  targets.forEach(t=>t.ghost=null);
  if (hintStep!==step||done) return;
  targets.filter(t=>t.step===step&&!t.placed).forEach(t=>{
    const g=makeBrick(t.key,t.color,'ghost'); placeObj(g,t.key,t.x,t.y,t.z,t.rot); levelRoot.add(g); ghosts.push(g); t.ghost=g;
  });
}
function updateTray(){
  tray.forEach((it,i)=>{ it.el.querySelector('.badge').textContent=it.left; it.el.classList.toggle('empty',it.left===0); it.el.classList.toggle('sel',i===sel); });
}

// ====================== MẢNH ĐANG CẦM ======================
function setPendingUI(on){
  $('bar').classList.toggle('holding',on);
  controls.enableRotate=!on && !done;
  updateTray();
}
function defaultSpot(){
  const d=camera.position.clone().sub(controls.target); d.y=0; d.normalize();
  const [sx,sz]=L.size;
  return {px:sx/2+d.x*(sx/2+1.4), pz:sz/2+d.z*(sz/2+1.4)};
}
function startPending(i,spot){
  if (done||!tray[i]||tray[i].left===0) return;
  endPending();
  sel=i; shownRot=null;
  // hướng mặc định = hướng của mảnh cùng loại còn thiếu (ưu tiên bước hiện tại)
  const same=t=>!t.placed&&t.key===tray[i].key&&t.color===tray[i].color;
  const ref=targets.find(t=>t.step===step&&same(t))||targets.find(same);
  rot=ref?ref.rot:0;
  preview=makeBrick(tray[i].key,tray[i].color,'preview'); levelRoot.add(preview);
  lastHit=spot||defaultSpot(); refreshPreview();
  setPendingUI(true); sfx.pick();
}
function endPending(){
  if (preview){ levelRoot.remove(preview); preview=null; }
  sel=-1; cand=null; setPendingUI(false);
}
function landY(x,z,fx,fz){ let m=0; for(let i=0;i<fx;i++) for(let j=0;j<fz;j++) m=Math.max(m,heights.get((x+i)+','+(z+j))||0); return m; }
// Tự xoay: thử 4 hướng, hướng nào khớp vị trí một mảnh của bước hiện tại thì dùng hướng đó
let shownRot=null;
function refreshPreview(){
  if (!preview||!lastHit) return;
  const it=tray[sel];
  const candFor=r=>{ const [fx,fz]=footprint(it.key,r);
    const x=clamp(Math.round(lastHit.px-fx/2),-M,L.size[0]+M-fx), z=clamp(Math.round(lastHit.pz-fz/2),-M,L.size[1]+M-fz);
    return {key:it.key,color:it.color,x,y:landY(x,z,fx,fz),z,rot:r}; };
  let c=null;
  for (let k=0;k<4 && !c;k++){ const t=candFor((rot+k)%4); if (targets.some(g=>g.step===step&&matches(g,t))) c=t; }
  cand=c||candFor(rot);
  placeObj(preview,it.key,cand.x,cand.y,cand.z,cand.rot);
  if (shownRot!==null && shownRot!==cand.rot){
    const inner=preview.userData.inner, a0=shownRot*Math.PI/2;
    let d=cand.rot*Math.PI/2-a0; d=Math.atan2(Math.sin(d),Math.cos(d));
    inner.rotation.y=a0;
    anims.push({t0:performance.now(),dur:140,fn:k=>{ inner.rotation.y=a0+d*(1-Math.pow(1-k,3)); }});
    tone(1100,0.03,'sine',0.05);
  }
  shownRot=cand.rot;
}

const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function setRay(cx,cy){ const r=canvas.getBoundingClientRect(); ndc.set((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera); }
function boardHit(cx,cy){
  setRay(cx,cy); const hits=ray.intersectObjects(pickables,false); if(!hits.length) return null;
  const h=hits[0], n=h.face.normal.clone().transformDirection(h.object.matrixWorld);
  return n.y>0.5 ? {px:h.point.x,pz:h.point.z} : {px:h.point.x+n.x*0.5,pz:h.point.z+n.z*0.5};
}
const liftPx=e=>e.pointerType==='touch'?app.clientWidth*0.1:0;
function moveTo(cx,cy){ const h=boardHit(cx,cy); if(h){ lastHit=h; refreshPreview(); trySnap(); } }

function matches(t,c){
  if (t.placed||t.key!==c.key||t.color!==c.color||t.x!==c.x||t.z!==c.z) return false;
  const a=footprint(t.key,t.rot), b=footprint(c.key,c.rot); if (a[0]!==b[0]||a[1]!==b[1]) return false;
  if (PARTS[c.key].shape==='slope'){ const f1=facing(t.rot), f2=facing(c.rot); if (f1[0]!==f2[0]||f1[1]!==f2[1]) return false; }
  return true;
}
// Nam châm: mảnh vừa tới đúng vị trí của bước hiện tại là tự lắp luôn
function trySnap(){
  if (done||!cand||!preview) return;
  const hit=targets.find(t=>t.step===step&&matches(t,cand)&&t.y===cand.y);
  if (hit) commit(hit);
}
// Thả tay ở chỗ chưa khớp: mảnh nằm chờ, nhắc nếu đúng chỗ mà sai thứ tự
function releaseHint(){
  if (done||!cand||!preview) return;
  const c=cand;
  if (targets.some(t=>t.step===step&&matches(t,c)&&t.y>c.y)) toast('Lắp các mảnh bên dưới trước nhé');
  else if (targets.some(t=>t.step>step&&matches(t,c)&&t.y===c.y)) toast('Đúng chỗ, nhưng là mảnh của bước sau');
}

const BIT_GEO=new THREE.BoxGeometry(0.16,0.16,0.16);
function burst(x,y,z,color,n=12){
  const t0=performance.now();
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(BIT_GEO,getMat(color,'solid')), a=Math.random()*Math.PI*2, sp=1.5+Math.random()*2;
    const v=new THREE.Vector3(Math.cos(a)*sp,2+Math.random()*2.5,Math.sin(a)*sp);
    m.position.set(x,y,z); levelRoot.add(m);
    anims.push({t0,dur:550,fn:k=>{ const t=k*0.55; m.position.set(x+v.x*t,y+v.y*t-6*t*t,z+v.z*t); m.scale.setScalar(1-k*0.9); m.rotation.x+=0.2; if(k>=1) levelRoot.remove(m); }});
  }
}
function confetti(){
  const t0=performance.now(), cols=[0xd42a1f,0xf5c518,0x2f7fd6,0x3fb56b,0xef7d1a,0x9b59d0], [sx,sz]=L.size;
  const geo=new THREE.PlaneGeometry(0.28,0.16);
  for(let i=0;i<90;i++){
    const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:cols[i%cols.length],side:THREE.DoubleSide}));
    const x=sx/2+(Math.random()-0.5)*(sx+6), z=sz/2+(Math.random()-0.5)*(sz+6), y0=iCenter.y*2+4+Math.random()*4, d=Math.random()*0.6;
    const sp=new THREE.Vector3(Math.random()*8,Math.random()*8,Math.random()*8);
    levelRoot.add(m);
    anims.push({t0:t0+d*1000,dur:2600,fn:k=>{ m.position.set(x+Math.sin(k*9+i)*0.6,y0-k*(y0+1),z); m.rotation.set(sp.x*k,sp.y*k,sp.z*k); if(k>=1) levelRoot.remove(m); }});
  }
}

function commit(t){
  t.placed=true;
  const o=makeBrick(t.key,t.color); placeObj(o,t.key,t.x,t.y,t.z,t.rot); levelRoot.add(o);
  pickables.push(o.userData.body);
  const [fx,fz]=footprint(t.key,t.rot);
  for(let i=0;i<fx;i++) for(let j=0;j<fz;j++) heights.set((t.x+i)+','+(t.z+j),t.y+PARTS[t.key].h);
  if (t.ghost){ levelRoot.remove(t.ghost); t.ghost=null; }
  const y1=t.y*PLATE, y0=y1+1;
  anims.push({t0:performance.now(),dur:220,fn:k=>{ o.position.y=y0+(y1-y0)*(1-Math.pow(1-k,3)); if(k>=1) burst(t.x+fx/2,y1+0.1,t.z+fz/2,t.color); }});
  o.position.y=y0;
  sfx.snap();
  const it=tray[sel]; it.left--; it.el.classList.remove('pop'); void it.el.offsetWidth; it.el.classList.add('pop');
  endPending(); updateChips(); updateProgress();
  if (targets.filter(x=>x.step===step).every(x=>x.placed)){
    if (step===L.steps.length-1) return win();
    sfx.step(); toast(`Bước ${step+1} xong!`,900);
    setStep(step+1);
  }
}

// ====================== BOOSTER ======================
function useHint(){
  if (done) return;
  if (boost.hint<=0) return toast('Hết lượt gợi ý');
  if (hintStep===step) return toast('Gợi ý đang hiện rồi');
  boost.hint--; boosterUsed=true; hintStep=step; refreshGhosts(); updateBoosters(); updateStars(); sfx.magic();
  toast('Bóng mờ cho biết chỗ lắp — mất 1 ★');
}
function useWand(){
  if (done) return;
  if (boost.wand<=0) return toast('Hết lượt tự lắp');
  const t=targets.filter(t=>t.step===step&&!t.placed).sort((a,b)=>a.y-b.y)[0];
  if (!t) return;
  boost.wand--; boosterUsed=true; updateBoosters(); updateStars(); sfx.magic();
  endPending(); sel=tray.findIndex(it=>it.key===t.key&&it.color===t.color);
  const [fx,fz]=footprint(t.key,t.rot);
  burst(t.x+fx/2,t.y*PLATE+0.6,t.z+fz/2,'yellow',18);
  commit(t);
}
let zoomOpen=false;
function openZoom(on){ zoomOpen=on; $('zoomModal').classList.toggle('show',on); }

// ====================== KẾT THÚC ======================
function win(){
  done=true; endPending(); refreshGhosts(); sfx.win();
  targets.forEach(t=>setBrickMode(t.iobj,t.color,'solid'));
  [...$('dots').children].forEach(d=>d.className='dt done');
  $('tag').textContent='HOÀN THÀNH!'; $('chips').innerHTML='';
  const stars=starsNow(), save=store.get(); save[levelIdx]=Math.max(save[levelIdx]||0,stars); store.set(save);
  setTimeout(confetti,250);
  controls.enableRotate=true; controls.autoRotate=true; controls.autoRotateSpeed=3;
  setTimeout(()=>showResult(stars),1700);
}
function showResult(stars){
  $('rTitle').textContent=['','HOÀN THÀNH!','GIỎI LẮM!','TUYỆT VỜI!'][stars];
  $('rInfo').textContent=`${L.name} · ${targets.length} mảnh${boosterUsed?' · có trợ giúp':''}`;
  $('rImg').src=thumbLevel(levelIdx);
  const ss=[...$('rStars').children]; ss.forEach(s=>s.classList.remove('on'));
  $('result').classList.add('show');
  ss.forEach((s,i)=>{ if(i<stars) setTimeout(()=>{ s.classList.add('on'); sfx.star(i); },400+i*300); });
}

// ====================== HOME ======================
let homeSel=0;
function showHome(){
  const save=store.get(), firstOpen=LEVELS.findIndex((_,i)=>!save[i]);
  homeSel=firstOpen<0?LEVELS.length-1:firstOpen;
  renderHome();
  ['result','pauseModal','zoomModal'].forEach(id=>$(id).classList.remove('show'));
  $('home').classList.add('show');
}
function renderHome(){
  const save=store.get();
  $('hImg').src=thumbLevel(homeSel); $('hName').textContent=LEVELS[homeSel].name; $('playSub').textContent=`Màn ${homeSel+1} · ${LEVELS[homeSel].steps.length} bước`;
  $('hLevels').innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const s=save[i]||0, b=document.createElement('button');
    b.className='btn '+(s?'green':'blue')+' lvc'+(i===homeSel?' cur':'');
    b.innerHTML=`<span class="outline${s?' g':''}">${i+1}</span><span class="st">${[0,1,2].map(k=>`<span class="${k<s?'':'off'}">★</span>`).join('')}</span>`;
    b.onclick=()=>{ homeSel=i; renderHome(); sfx.pick(); };
    $('hLevels').appendChild(b);
  });
}

// ====================== INPUT ======================
let trayDrag=null;
function trayDown(e,idx){
  if (done||tray[idx].left===0) return;
  trayDrag={idx,x0:e.clientX,y0:e.clientY,started:false,lift:liftPx(e)};
}
addEventListener('pointermove',e=>{
  if (!trayDrag) return;
  const dx=e.clientX-trayDrag.x0, dy=trayDrag.y0-e.clientY;
  if (!trayDrag.started && dy>10 && dy>Math.abs(dx)){ trayDrag.started=true; startPending(trayDrag.idx); }
  if (trayDrag.started && e.clientY<$('slots').getBoundingClientRect().top) moveTo(e.clientX,e.clientY-trayDrag.lift);
});
addEventListener('pointerup',()=>{
  if (!trayDrag) return;
  if (!trayDrag.started){ if (sel===trayDrag.idx) endPending(); else startPending(trayDrag.idx); }
  else releaseHint();
  trayDrag=null;
});
addEventListener('pointercancel',()=>{ trayDrag=null; });

let ptr=null, touches=0;
canvas.addEventListener('pointerdown',e=>{
  touches++;
  if (!preview||touches>1){ ptr=null; return; }
  ptr={x:e.clientX,y:e.clientY,moved:false,lift:liftPx(e)};
});
canvas.addEventListener('pointermove',e=>{
  if (!ptr||!preview) return;
  if (!ptr.moved && Math.hypot(e.clientX-ptr.x,e.clientY-ptr.y)>8) ptr.moved=true;
  if (ptr.moved) moveTo(e.clientX,e.clientY-ptr.lift);
});
canvas.addEventListener('pointerup',e=>{
  touches=Math.max(0,touches-1);
  if (ptr && preview){ if (ptr.moved) releaseHint(); else moveTo(e.clientX,e.clientY); }
  ptr=null;
});
canvas.addEventListener('pointercancel',()=>{ touches=Math.max(0,touches-1); ptr=null; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());

// camera
function animCam(toPos,dur=320){
  controls.autoRotate=false;
  const from=camera.position.clone(), t0=performance.now();
  anims.push({t0,dur,fn:k=>{ const e=1-Math.pow(1-k,3); camera.position.lerpVectors(from,toPos,e); }});
}
function rotateCam(dir){
  controls.autoRotate=false;
  const t=controls.target.clone(), off=camera.position.clone().sub(t), t0=performance.now();
  anims.push({t0,dur:320,fn:k=>{ const e=1-Math.pow(1-k,3); camera.position.copy(off.clone().applyAxisAngle(UP,dir*Math.PI/2*e)).add(t); }});
  tone(800,0.04,'sine',0.05);
}
function setDist(d,animate){
  d=clamp(d,controls.minDistance,controls.maxDistance);
  const p=controls.target.clone().add(camera.position.clone().sub(controls.target).setLength(d));
  if (animate) animCam(p,180); else camera.position.copy(p);
}
const camDist=()=>camera.position.distanceTo(controls.target);
$('zIn').onclick=()=>setDist(camDist()*0.8,true);
$('zOut').onclick=()=>setDist(camDist()*1.25,true);
$('zCenter').onclick=()=>animCam(controls.target.clone().addScaledVector(defDir,defDist),400);
let zdrag=false;
const zFromY=e=>{ const r=$('ztrack').getBoundingClientRect(), k=clamp((e.clientY-r.top)/r.height,0,1); setDist(controls.minDistance+k*(controls.maxDistance-controls.minDistance)); };
$('ztrack').addEventListener('pointerdown',e=>{ zdrag=true; $('ztrack').setPointerCapture(e.pointerId); zFromY(e); });
$('ztrack').addEventListener('pointermove',e=>{ if(zdrag) zFromY(e); });
$('ztrack').addEventListener('pointerup',()=>{ zdrag=false; });

$('bHint').onclick=useHint;
$('bWand').onclick=useWand;
$('bLook').onclick=()=>openZoom(true);
$('iview').onclick=()=>openZoom(true);
$('zoomModal').onclick=()=>openZoom(false);
$('aCancel').onclick=endPending;
$('pauseBtn').onclick=()=>{ $('pauseModal').classList.add('show'); sfx.pick(); };
$('pResume').onclick=()=>$('pauseModal').classList.remove('show');
$('pRestart').onclick=()=>loadLevel(levelIdx);
$('pMenu').onclick=showHome;
$('rMenu').onclick=showHome;
$('rAgain').onclick=()=>loadLevel(levelIdx);
$('rNext').onclick=()=>{ if (levelIdx<LEVELS.length-1) loadLevel(levelIdx+1); else showHome(); };
$('playBtn').onclick=()=>{ loadLevel(homeSel); sfx.pick(); };
addEventListener('keydown',e=>{
  const k=e.key;
  if (k==='Escape') { if (zoomOpen) openZoom(false); else endPending(); }
  else if (k==='h'||k==='H') useHint();
  else if (k==='ArrowLeft') rotateCam(-1);
  else if (k==='ArrowRight') rotateCam(1);
  else if (/^[1-9]$/.test(k) && tray[+k-1]) startPending(+k-1);
});

// ====================== LOOP ======================
function resize(){
  const w=app.clientWidth, h=app.clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.setViewOffset(w,h,0,-h*0.035,w,h); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(app); resize();
const tmp=new THREE.Vector3();
function innerRect(el){ const r=el.getBoundingClientRect(); return {left:r.left+el.clientLeft,top:r.top+el.clientTop,width:el.clientWidth,height:el.clientHeight}; }
function frame(){
  requestAnimationFrame(frame);
  const now=performance.now();
  controls.update();
  anims=anims.filter(a=>{ const k=clamp((now-a.t0)/a.dur,0,1); a.fn(k); return k<1; });
  const pulse=(Math.sin(now/220)+1)/2;
  hlMats.forEach(m=>m.emissive.setRGB(0.35*pulse,0.22*pulse,0));
  if (preview) preview.userData.mat.opacity=0.62+0.2*pulse;
  if (L && controls.maxDistance>controls.minDistance)
    $('zthumb').style.top=clamp((camDist()-controls.minDistance)/(controls.maxDistance-controls.minDistance),0,1)*100+'%';
  const cr=canvas.getBoundingClientRect(), w=cr.width, h=cr.height;
  renderer.setScissorTest(false); renderer.setViewport(0,0,w,h);
  renderer.setClearColor(0x000000,0); renderer.clear();
  if ($('home').classList.contains('show')) return;
  renderer.render(scene,camera);
  const el=zoomOpen?$('iviewBig'):$('iview'), r=innerRect(el);
  if (L && r.width>0 && r.height>0){
    const x=r.left-cr.left, y=cr.bottom-(r.top+r.height);
    renderer.setViewport(x,y,r.width,r.height); renderer.setScissor(x,y,r.width,r.height); renderer.setScissorTest(true);
    renderer.setClearColor(0xfffaf0,1); renderer.clear();
    tmp.copy(camera.position).sub(controls.target).normalize();
    icam.aspect=r.width/r.height; icam.updateProjectionMatrix();
    icam.position.copy(iCenter).addScaledVector(tmp,fitDist(icam,iRadius,icam.aspect)*0.9); icam.lookAt(iCenter);
    renderer.render(iscene,icam);
  }
}
loadLevel(0);
showHome();
requestAnimationFrame(frame);
</script>
